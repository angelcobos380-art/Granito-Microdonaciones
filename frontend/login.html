<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso · Granito</title><link rel="stylesheet" href="css/styles.css"></head><body><div data-nav></div><main class="wrap"><form id="auth-form" class="panel form" novalidate><p class="eyebrow">Tu cuenta Granito</p><h1>Bienvenida/o</h1><input id="mode" name="mode" value="login" type="hidden"><div id="name-wrap" class="hidden"><label for="nombre">Nombre</label><input id="nombre" name="nombre" autocomplete="name"><div class="field-error" id="nameError"></div></div><label for="correo">Correo electrónico</label><input id="correo" name="correo" type="email" autocomplete="email"><div class="field-error" id="emailError"></div><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password"><div class="field-error" id="passwordError"></div><div id="formStatus" aria-live="polite"></div><button id="submit" class="btn" type="submit">Iniciar sesión</button><button id="switch" class="btn light" type="button">¿No tienes cuenta? Regístrate</button></form></main><script type="module" src="js/login.js"></script></body></html>
